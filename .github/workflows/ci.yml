name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar archivos
        run: |
          echo "Comprobando proyecto..."
          test -f index.html

      - name: Finalizar
        run: echo "Comprobación completada correctamente"